name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Deploy Worker, store the master hash, and apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            ADMIN_TOKEN_HASH
          postCommands: wrangler d1 migrations apply tutor-notes-db --remote
        env:
          ADMIN_TOKEN_HASH: ${{ secrets.ADMIN_TOKEN_HASH }}
